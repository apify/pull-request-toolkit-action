name: 'Apify PR toolkit'
description: 'This action automates a couple of processes connected with the management of GitHub pull requests.'
author: 'Apify'
inputs:
    repo-token:
        required: true
        description: 'Repository GitHub token'
    org-token:
        required: true
        description: 'GitHub token with read and write access (required for GitHub Projects v2 sprint assignment)'
    zenhub-token:
        required: true
        description: 'ZenHub API token'
runs:
    using: 'composite'
    steps:
        - name: 'Apify PR toolkit'
          uses: actions/github-script@v9
          env:
            GITHUB_REPO_TOKEN: ${{ inputs.repo-token }}
            GITHUB_ORG_TOKEN: ${{ inputs.org-token }}
            ZENHUB_TOKEN: ${{ inputs.zenhub-token }}
          with:
            github-token: ${{ inputs.repo-token }}
            script: |
              const { main } = require('${{ github.action_path }}/src/main.ts');

              await main({
                  getOctokit,
                  context,
                  core,
                  env: process.env,
              });
