name: Lint, test, type check and formatting check

on:
  workflow_dispatch:

  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  run-checks:
    runs-on: ubuntu-22.04-arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Check types
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm run test
