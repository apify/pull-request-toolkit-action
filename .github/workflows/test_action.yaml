# This runs the action against itself to make sure it works as expected.
# This is not the workflow that needs to be used in the repositories that want to use this action.
# For that, see the run_action.yaml workflow.
name: "[Testing] Apify Pull Request Toolkit"

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize', 'labeled', 'unlabeled', 'edited', 'ready_for_review']

concurrency: # This is to make sure that it's executed only for the most recent changes of PR.
  group: testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apify-pull-request-toolkit:
    # This is to make sure that this workflow is only run when the action is tested against itself.
    if: github.repository == 'apify/pull-request-toolkit-action'
    runs-on: ubuntu-latest
    steps:
      - name: clone local repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: run pull-request-toolkit action
        uses: ./
        with:
          org-token: ${{ secrets.PULL_REQUEST_TOOLKIT_ACTION_GITHUB_TOKEN }}
