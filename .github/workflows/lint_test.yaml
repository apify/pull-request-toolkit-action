name: Lint and test

on:
  workflow_dispatch:

  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  lint_and_test:
    runs-on: ubuntu-22.04-arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          check-latest: true

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Test
        run: npm run test
